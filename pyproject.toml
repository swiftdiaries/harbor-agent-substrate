[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "harbor-agent-substrate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "harbor @ git+https://github.com/harbor-framework/harbor.git@3665008f25744a7137215b3425e4f06a70fda297",
    "ate-env-client @ git+https://github.com/swiftdiaries/env.git@ab40c7bfb2049af1a7aade9e7bf9c6cac925b5ca#subdirectory=clients/python",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: requires an operator-supplied existing cluster"]
