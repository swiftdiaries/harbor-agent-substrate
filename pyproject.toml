[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "harbor-agent-substrate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "harbor @ git+file:///Users/adhita/projects/python/src/github.com/harbor-framework/harbor@d9293aa1f532a14f14880c53b81f4d393ce7f148",
    "ate-env-client @ git+file:///Users/adhita/projects/python/src/github.com/agent-substrate/env@ab40c7bfb2049af1a7aade9e7bf9c6cac925b5ca#subdirectory=clients/python",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "ty"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: requires an operator-supplied existing cluster"]
